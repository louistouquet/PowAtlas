name: collect

# Daily collection of the SP1 score core (docs/specs/2026-10-22-sp1-archive-design.md).
# Each task has two triggers; crons must match src/powatlas/catalogue.toml
# (checked by tests/test_workflow.py). The state of the collection is carried
# by the artifact names: <source>__<ref>__<state>.

on:
  schedule:
    - cron: "35 2 * * *"   # icon-d2, first
    - cron: "35 8 * * *"   # icon-d2, last
    - cron: "5 5 * * *"    # icon-eu, first
    - cron: "35 10 * * *"  # icon-eu, last
    - cron: "50 6 * * *"   # meteofrance-pnt, first
    - cron: "50 12 * * *"  # meteofrance-pnt, last
    - cron: "50 8 * * *"   # ecmwf, first
    - cron: "50 14 * * *"  # ecmwf, last
    - cron: "50 9 * * *"   # observations, first
    - cron: "50 17 * * *"  # observations, last
  workflow_dispatch:
    inputs:
      task:
        description: "Task id from catalogue.toml (e.g. icon-d2)"
        required: true
        type: string
      attempt:
        description: "first or last (last opens an issue on definitive losses)"
        required: true
        default: last
        type: choice
        options: [first, last]
      now:
        description: "Optional UTC time to plan for (e.g. 2026-11-01T02:35:00Z)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      task: ${{ steps.resolve.outputs.task }}
      attempt: ${{ steps.resolve.outputs.attempt }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install powatlas
        run: python -m pip install .
      - name: Resolve task
        id: resolve
        env:
          CRON: ${{ github.event.schedule }}
          TASK: ${{ inputs.task }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          if [ -n "$CRON" ]; then
            powatlas resolve-schedule --cron "$CRON"
          else
            if ! [[ "$TASK" =~ ^[a-z0-9-]+$ ]]; then echo "invalid task: $TASK" >&2; exit 1; fi
            echo "task=$TASK" >> "$GITHUB_OUTPUT"
            echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan units
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK: ${{ steps.resolve.outputs.task }}
          NOW: ${{ inputs.now }}
        run: powatlas plan --task "$TASK" ${NOW:+--now "$NOW"}

  collect:
    needs: plan
    if: needs.plan.outputs.units != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One unit is never collected twice at the same time (overlapping triggers);
    # the queued job then skips the unit if it became complete.
    concurrency:
      group: collect-unit-${{ matrix.unit }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install powatlas
        run: python -m pip install .
      - name: Collect
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIT: ${{ matrix.unit }}
          NOW: ${{ inputs.now }}
        run: powatlas collect --unit "$UNIT" --out out --skip-if-complete ${NOW:+--now "$NOW"}
      - name: Upload unit
        if: steps.collect.outputs.state != 'already-complete'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.unit }}__${{ steps.collect.outputs.state }}
          path: out/${{ matrix.unit }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  report:
    needs: [plan, collect]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install powatlas
        run: python -m pip install .
      - name: Report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK: ${{ needs.plan.outputs.task }}
          ATTEMPT: ${{ needs.plan.outputs.attempt }}
          NOW: ${{ inputs.now }}
        run: powatlas report --task "$TASK" --attempt "$ATTEMPT" ${NOW:+--now "$NOW"}
