name: python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install powatlas
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  # The pilot's PC (sync, status, backfill): Windows, Python 3.14. Not a required check.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install powatlas
        run: python -m pip install -e .
      - name: ecCodes library
        run: python -c "import eccodes; print(eccodes.codes_get_api_version())"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
