name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests of the checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check documentation links and records
        run: python3 scripts/check_docs.py
