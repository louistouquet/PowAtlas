# PowAtlas SP1 catalogue: what is collected, where, when.
# Spec: docs/specs/2026-10-22-sp1-archive-design.md. All times are UTC.
# Steps are inclusive [start, stop, step] ranges in hours.

[settings]
bbox = [5.0, 43.5, 7.9, 46.5]   # west, south, east, north (degrees, WGS84)
margin_cells = 2                # grid cells kept around the bbox
artifact_retention_days = 30
repository = "louistouquet/PowAtlas"
collect_budget_minutes = 75     # per unit; the collect job is killed at 90 minutes

[settings.http]
retries = 5
backoff = 2.0          # seconds, doubled at each retry
max_backoff = 300.0
min_interval = 0.2     # seconds between requests (politeness)
timeout = 60.0

# First and second trigger of each task (minute off the hour, spec section 3).
[tasks.icon-d2]
crons = ["35 2 * * *", "35 8 * * *"]

[tasks.icon-eu]
crons = ["5 5 * * *", "35 10 * * *"]

[tasks.meteofrance-pnt]
crons = ["50 6 * * *", "50 12 * * *"]

[tasks.ecmwf]
crons = ["50 8 * * *", "50 14 * * *"]

[tasks.observations]
crons = ["50 9 * * *", "50 17 * * *"]

[sources.icon-d2]
family = "dwd-icon"
kind = "forecast"
task = "icon-d2"
fiche = "docs/sources/icon-dwd.md"
licence = "CC BY 4.0"
attribution = "Contains data from Deutscher Wetterdienst (DWD), licensed CC BY 4.0; cropped to the French Alps by PowAtlas"
run_hours = [0]
steps = [[0, 48, 1]]
window_days = 0                 # 24 h retention: only today's run can be fetched
available_after_hours = 1.5     # last step of the 12 UTC run seen at +1 h 21 (R0.2)
grid = { ni = 1215, nj = 746, lat_first = 43.18, lon_first = 356.06, di = 0.02, dj = 0.02 }
# {HH}: run hour, {run}: AAAAMMJJHH, {step}: 3-digit step, {var}/{VAR}: variable in lower/upper case
urls = { file = "https://opendata.dwd.de/weather/nwp/icon-d2/grib/{HH}/{var}/icon-d2_germany_regular-lat-lon_single-level_{run}_{step}_2d_{var}.grib2.bz2" }

[sources.icon-d2.variables]
t_2m = { shortName = "2t" }
tot_prec = { shortName = "tp" }
snow_gsp = { shortName = "lsfwe" }
snow_con = { shortName = "csfwe" }
h_snow = { shortName = "sde" }
w_snow = { shortName = "sd" }
hzerocl = { shortName = "HZEROCL" }
snowlmt = { shortName = "SNOWLMT" }

[sources.icon-eu]
family = "dwd-icon"
kind = "forecast"
task = "icon-eu"
fiche = "docs/sources/icon-dwd.md"
licence = "CC BY 4.0"
attribution = "Contains data from Deutscher Wetterdienst (DWD), licensed CC BY 4.0; cropped to the French Alps by PowAtlas"
run_hours = [0]
steps = [[0, 78, 1], [81, 120, 3]]
window_days = 0
available_after_hours = 3.7     # last step of the 12 UTC run seen at +3 h 39 (R0.2)
grid = { ni = 1377, nj = 657, lat_first = 29.5, lon_first = 336.5, di = 0.0625, dj = 0.0625 }
urls = { file = "https://opendata.dwd.de/weather/nwp/icon-eu/grib/{HH}/{var}/icon-eu_europe_regular-lat-lon_single-level_{run}_{step}_{VAR}.grib2.bz2" }

[sources.icon-eu.variables]
t_2m = { shortName = "2t" }
tot_prec = { shortName = "tp" }
snow_gsp = { shortName = "lsfwe" }
snow_con = { shortName = "csfwe" }
h_snow = { shortName = "sde" }
w_snow = { shortName = "sd" }
hzerocl = { shortName = "HZEROCL" }
snowlmt = { shortName = "SNOWLMT" }

# Météo-France PNT packages (S3, no index): files listed per package, message
# headers read by byte ranges, selected by GRIB2 identity
# [discipline, category, number, type of first surface, its value]
# (inspection of 2026-10-22, docs/sources/arome.md and arpege.md).

[sources.arome-0025]
family = "meteofrance-pnt"
kind = "forecast"
task = "meteofrance-pnt"
fiche = "docs/sources/arome.md"
licence = "Licence Ouverte 2.0"
attribution = "Source : Météo-France (Licence Ouverte 2.0) ; données découpées sur les Alpes françaises par PowAtlas"
run_hours = [0]
steps = [[0, 51, 1]]
window_days = 7                 # 14 days kept on the bucket; catch-up over the last 7
available_after_hours = 3.5     # 00 UTC run complete at 02:54 on 2026-10-22
grid = { ni = 1121, nj = 717, lat_first = 55.4, lon_first = 348.0, di = 0.025, dj = 0.025 }
urls = { base = "https://meteofrance-pnt.s3.rbx.io.cloud.ovh.net/", prefix = "pnt/{iso}/arome/0025/{package}/" }

[sources.arome-0025.variables]
"2t" = { shortName = "2t", package = "SP1", grib = [0, 0, 0, 103, 2] }
"2r" = { shortName = "2r", package = "SP1", grib = [0, 1, 1, 103, 2] }
"10u" = { shortName = "10u", package = "SP1", grib = [0, 2, 2, 103, 10] }
"10v" = { shortName = "10v", package = "SP1", grib = [0, 2, 3, 103, 10] }
tp = { shortName = "tp", package = "SP1", grib = [0, 1, 52, 1, 0], steps = [[1, 51, 1]] }
tsnowp = { shortName = "tsnowp", package = "SP1", grib = [0, 1, 66, 1, 0], steps = [[1, 51, 1]] }
tgrp = { shortName = "tgrp", package = "SP1", grib = [0, 1, 75, 1, 0], steps = [[1, 51, 1]] }

[sources.arpege-01]
family = "meteofrance-pnt"
