# PowAtlas SP1 catalogue: what is collected, where, when.
# Spec: docs/specs/2026-10-22-sp1-archive-design.md. All times are UTC.
# Steps are inclusive [start, stop, step] ranges in hours.

[settings]
bbox = [5.0, 43.5, 7.9, 46.5]   # west, south, east, north (degrees, WGS84)
margin_cells = 2                # grid cells kept around the bbox
artifact_retention_days = 30

[settings.http]
retries = 5
backoff = 2.0          # seconds, doubled at each retry
max_backoff = 300.0
min_interval = 0.2     # seconds between requests (politeness)
timeout = 60.0

# First and second trigger of each task (minute off the hour, spec section 3).
[tasks.icon-d2]
crons = ["35 2 * * *", "35 8 * * *"]

[tasks.icon-eu]
crons = ["5 5 * * *", "35 10 * * *"]

[tasks.observations]
crons = ["50 9 * * *", "50 17 * * *"]

[sources.icon-d2]
family = "dwd-icon"
kind = "forecast"
task = "icon-d2"
fiche = "docs/sources/icon-dwd.md"
licence = "CC BY 4.0"
attribution = "Contains data from Deutscher Wetterdienst (DWD), licensed CC BY 4.0; cropped to the French Alps by PowAtlas"
run_hours = [0]
steps = [[0, 48, 1]]
window_days = 0                 # 24 h retention: only today's run can be fetched
available_after_hours = 1.5     # last step of the 12 UTC run seen at +1 h 21 (R0.2)
grid = { ni = 1215, nj = 746, lat_first = 43.18, lon_first = 356.06, di = 0.02, dj = 0.02 }
# {HH}: run hour, {run}: AAAAMMJJHH, {step}: 3-digit step, {var}/{VAR}: variable in lower/upper case
urls = { file = "https://opendata.dwd.de/weather/nwp/icon-d2/grib/{HH}/{var}/icon-d2_germany_regular-lat-lon_single-level_{run}_{step}_2d_{var}.grib2.bz2" }

[sources.icon-d2.variables]
t_2m = { shortName = "2t" }
tot_prec = { shortName = "tp" }
snow_gsp = { shortName = "lsfwe" }
snow_con = { shortName = "csfwe" }
h_snow = { shortName = "sde" }
w_snow = { shortName = "sd" }
hzerocl = { shortName = "HZEROCL" }
snowlmt = { shortName = "SNOWLMT" }

[sources.icon-eu]
family = "dwd-icon"
kind = "forecast"
task = "icon-eu"
fiche = "docs/sources/icon-dwd.md"
licence = "CC BY 4.0"
attribution = "Contains data from Deutscher Wetterdienst (DWD), licensed CC BY 4.0; cropped to the French Alps by PowAtlas"
run_hours = [0]
steps = [[0, 78, 1], [81, 120, 3]]
window_days = 0
available_after_hours = 3.7     # last step of the 12 UTC run seen at +3 h 39 (R0.2)
grid = { ni = 1377, nj = 657, lat_first = 29.5, lon_first = 336.5, di = 0.0625, dj = 0.0625 }
urls = { file = "https://opendata.dwd.de/weather/nwp/icon-eu/grib/{HH}/{var}/icon-eu_europe_regular-lat-lon_single-level_{run}_{step}_{VAR}.grib2.bz2" }

[sources.icon-eu.variables]
t_2m = { shortName = "2t" }
tot_prec = { shortName = "tp" }
snow_gsp = { shortName = "lsfwe" }
snow_con = { shortName = "csfwe" }
h_snow = { shortName = "sde" }
w_snow = { shortName = "sd" }
hzerocl = { shortName = "HZEROCL" }
snowlmt = { shortName = "SNOWLMT" }

# Observations: dated verbatim copies, one unit per collection day (window 0:
# each API answer already covers its own 1 to 7 days). "nature" tells observed,
# modelled and metadata apart (R0.3, rule 9).

[sources.slf]
family = "snapshot"
kind = "observation"
task = "observations"
fiche = "docs/sources/slf-imis.md"
licence = "CC BY 4.0"
attribution = "Source: WSL Institute for Snow and Avalanche Research SLF, www.slf.ch (CC BY 4.0)"
window_days = 0
available_after_hours = 9.5
urls = {}

[sources.slf.variables]
"imis-stations.json" = { url = "https://measurement-api.slf.ch/public/api/imis/stations", nature = "metadata" }
"imis-measurements.json" = { url = "https://measurement-api.slf.ch/public/api/imis/measurements", nature = "observed (IMIS sensors, 30 min, last ~24 h)" }
"imis-measurements-precipitation.json" = { url = "https://measurement-api.slf.ch/public/api/imis/measurements-precipitation", nature = "observed (IMIS precipitation stations, 30 min)" }
"imis-daily-snow.json" = { url = "https://measurement-api.slf.ch/public/api/imis/daily-snow?period_in_days=7", nature = "HS observed; HN_1D modelled by SNOWPACK" }
"study-plot-stations.json" = { url = "https://measurement-api.slf.ch/public/api/study-plot/stations", nature = "metadata" }
"study-plot-measurements.json" = { url = "https://measurement-api.slf.ch/public/api/study-plot/measurements", nature = "observed (manual study plots: HN_1D, HNW_1D)" }

[sources.arpa-piemonte]
family = "snapshot"
kind = "observation"
task = "observations"
fiche = "docs/sources/arpa-piemonte.md"
licence = "CC BY 4.0"
attribution = "Fonte: Arpa Piemonte - www.arpa.piemonte.it (CC BY 4.0)"
window_days = 0
available_after_hours = 9.5
urls = {}

[sources.arpa-piemonte.variables]
"pie-neve.json" = { url = "https://utility.arpa.piemonte.it/api_realtime/pie_neve", nature = "observed (validated snow height, 7 days)" }
"pie-anag.json" = { url = "https://utility.arpa.piemonte.it/api_realtime/pie_anag", nature = "metadata" }

[sources.meteofrance-nivo]
family = "snapshot"
kind = "observation"
task = "observations"
fiche = "docs/sources/reseau-nivo-meteo.md"
licence = "Licence Ouverte 2.0"
attribution = "Source : Météo-France (Licence Ouverte 2.0)"
window_days = 0
available_after_hours = 9.5     # file refreshed once a day, 06:30 UTC on 2026-10-21 and 2026-10-22
urls = {}

[sources.meteofrance-nivo.variables]
# rule "yearly": file of the collection year; from 1 to 7 January also the previous
# year's file (last updates), the new year's file being optional.
"nivo" = { url = "https://meteofrance.s3.sbg.io.cloud.ovh.net/data/OBS/NIVOSE/nivo_{year}.csv.gz", rule = "yearly", name = "nivo_{year}.csv.gz", nature = "observed (manual, ssfrai, ht_neige)" }

[sources.meteofrance-quot]
family = "snapshot"
kind = "observation"
task = "observations"
fiche = "docs/sources/meteo-france-observations.md"
licence = "Licence Ouverte 2.0"
attribution = "Source : Météo-France (Licence Ouverte 2.0)"
window_days = 0
available_after_hours = 9.5     # daily files refreshed 08:50-09:00 UTC on 2026-10-21
urls = {}

[sources.meteofrance-quot.variables]
# rule "quot": season name (e.g. 2025-2026) read from the bucket listing.
"quot" = { url = "https://meteofrance.s3.sbg.io.cloud.ovh.net/data/synchro_ftp/BASE/QUOT/Q_{dep}_latest-{season}_autres-parametres.csv.gz", rule = "quot", name = "Q_{dep}_latest-{season}_autres-parametres.csv.gz", departments = ["04", "05", "06", "38", "73", "74"], listing = "https://meteofrance.s3.sbg.io.cloud.ovh.net/?list-type=2&prefix=data/synchro_ftp/BASE/QUOT/Q_73_latest", nature = "observed (HNEIGEF, NEIGETOT06 and quality codes)" }
