"10v" = { shortName = "10v", package = "SP1", grib = [0, 2, 3, 103, 10] }
tp = { shortName = "tp", package = "SP1", grib = [0, 1, 52, 1, 0], steps = [[1, 102, 1]] }
tsnowp = { shortName = "tsnowp", package = "SP1", grib = [0, 1, 66, 1, 0], steps = [[1, 102, 1]] }
